name: Check live Kaggle connection storage
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-kaggle-storage.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check encrypted connection presence
        id: storage
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes studiosorrydotco@studio.sorrydotcom.lk 'bash -s' <<'REMOTE'
          set -euo pipefail
          export LD_LIBRARY_PATH="$HOME/.local${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd ~/apps/sorrydotcomeditor/current
          "$HOME/.local/node/bin/node" --input-type=module <<'NODE'
          import { access, readdir, realpath } from 'node:fs/promises';
          import { connect, loadEnvironment } from 'noderyx-framework';
          import { KaggleApiService } from './app/Services/KaggleApiService.js';
          loadEnvironment();
          const { default: config } = await import('./noderyx.config.js');
          const db = await connect(config.database);
          const [scene] = await db.query('SELECT p.user_id FROM scenes s JOIN projects p ON p.id=s.project_id WHERE s.id=?', [5]);
          const service = new KaggleApiService({ database: db });
          const available = await service.run({ action: 'probe' }).then(() => 'runtime-ready', () => 'runtime-unavailable');
          const shared = await realpath('storage') === await realpath('../..' + '/shared/storage').catch(() => '') ? 'shared' : 'check-storage-layout';
          const other = await readdir(service.root).then(files => files.some(file => /^user-\d+\.json$/.test(file)), () => false);
          let result = 'scene-missing';
          if (scene) {
            result = await service.credentials(scene.user_id).then(c => c ? 'owner-connection-present' : 'owner-connection-missing', () => 'owner-connection-unreadable');
            if (result === 'owner-connection-missing') {
              const releases = await readdir('../../releases');
              const candidates = await Promise.all(releases.filter(release => /^[0-9a-f]{40}$/.test(release)).map(release => access('../../releases/' + release + '/storage/kaggle-api/user-' + Number(scene.user_id) + '.json').then(() => true, () => false)));
              if (candidates.includes(true)) result = 'owner-connection-found-in-old-release';
            }
          }
          console.log([result, available, shared, other ? 'saved-connections-exist' : 'no-saved-connections'].join(' '));
          process.exit(0);
          NODE
          REMOTE
          )"
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: "Storage result — ${{ steps.storage.outputs.result }}"
        run: echo 'No credentials or user identifiers are printed.'

