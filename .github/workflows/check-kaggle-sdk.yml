name: Diagnose Kaggle SDK imports
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-kaggle-sdk.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check the SDK import on the live server
        id: probe
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          for attempt in {1..18}; do
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes studiosorrydotco@studio.sorrydotcom.lk 'bash -s' <<'REMOTE'
          set -euo pipefail
          export LD_LIBRARY_PATH="$HOME/.local${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd ~/apps/sorrydotcomeditor/current
          "$HOME/.local/node/bin/node" --input-type=module <<'NODE'
          import { loadEnvironment } from 'noderyx-framework';
          import { existsSync } from 'node:fs';
          import { spawnSync } from 'node:child_process';
          loadEnvironment();
          const hosted = process.env.HOME + '/apps/sorrydotcomeditor/shared/kaggle-venv/bin/python';
          const python = process.env.KAGGLE_PYTHON || (existsSync(hosted) ? hosted : 'python3');
          const probe = spawnSync(python, ['-c', `
          import contextlib, io, os, re, sys, tempfile, traceback
          from importlib.metadata import version
          for key in ("KAGGLE_USERNAME", "KAGGLE_KEY", "KAGGLE_API_TOKEN"):
              os.environ.pop(key, None)
          with tempfile.TemporaryDirectory() as directory:
              os.environ["KAGGLE_CONFIG_DIR"] = directory
              try:
                  with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                      from kaggle.api.kaggle_api_extended import KaggleApi
                  result = "import-ready"
              except BaseException as exc:
                  module = getattr(exc, "name", "") or ""
                  if not re.fullmatch(r"[A-Za-z0-9_.]*", module):
                      module = ""
                  frames = " ".join(f"{os.path.basename(frame.filename)}:{frame.lineno}" for frame in traceback.extract_tb(exc.__traceback__)[-3:])
                  result = f"{type(exc).__name__} {module} {frames}"
              print(f"Python {sys.version.split()[0]}: {result}")
          `], { encoding: 'utf8' });
          console.log(probe.stdout?.trim() || 'Python process could not run');
          NODE
          REMOTE
          )"
            if [[ "$result" == *import-ready ]]; then break; fi
            sleep 8
          done
          printf 'result=%s\n' "$result" >> "$GITHUB_OUTPUT"
          [[ "$result" == *import-ready ]]
      - name: "SDK import — ${{ steps.probe.outputs.result }}"
        run: echo 'Only module names and source locations are reported.'

