name: Verify live Scene 5 Kaggle import
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-scene-kaggle.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify the finished clip on the live server
        id: result
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes studiosorrydotco@studio.sorrydotcom.lk 'bash -s' <<'REMOTE'
          set -euo pipefail
          export LD_LIBRARY_PATH="$HOME/.local${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          base="$HOME/apps/sorrydotcomeditor"
          for attempt in {1..32}; do
            if grep -Fq "def main():" "$base/current/scripts/kaggle-api.py"; then break; fi
            sleep 5
          done
          cd "$base/current"
          grep -Fq "def main():" scripts/kaggle-api.py
          "$HOME/.local/node/bin/node" --input-type=module <<'NODE'
          import { stat } from 'node:fs/promises';
          import { spawnSync } from 'node:child_process';
          import { connect, loadEnvironment } from 'noderyx-framework';
          import { KaggleApiService, runKaggle } from './app/Services/KaggleApiService.js';
          loadEnvironment();
          const { default: config } = await import('./noderyx.config.js');
          const db = await connect(config.database);
          const diagnose = async (payload, timeout) => {
            if (payload.action !== "output") return runKaggle(payload, timeout);
            const python = process.env.KAGGLE_PYTHON || '../../shared/kaggle-venv/bin/python';
            const code = [
              "import contextlib, importlib.util, io, json, os, re, sys, traceback",
              "spec = importlib.util.spec_from_file_location('bridge', 'scripts/kaggle-api.py')",
              "bridge = importlib.util.module_from_spec(spec)",
              "spec.loader.exec_module(bridge)",
              "try:",
              "    with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):",
              "        result = bridge.run(json.load(sys.stdin))",
              "    print(json.dumps(result))",
              "except BaseException as exc:",
              "    status = getattr(getattr(exc, 'response', None), 'status_code', None)",
              "    frames = [f'{os.path.basename(item.filename)}-{item.lineno}' for item in traceback.extract_tb(exc.__traceback__)[-5:]]",
              "    print(json.dumps({'error': ' '.join([type(exc).__name__, str(status), *frames])}))",
            ].join('\n');
            const run = spawnSync(python, ['-c', code], { input: JSON.stringify(payload), encoding: 'utf8', timeout });
            const result = JSON.parse(run.stdout || '{}');
            if (!result.video) throw new Error(result.error || 'diagnostic subprocess failed');
            return result;
          };
          const current = async () => (await db.query('SELECT s.*,p.user_id FROM scenes s JOIN projects p ON p.id=s.project_id WHERE s.id=?',[5]))[0];
          let scene = await current();
          let outcome = 'scene-not-imported';
          if (scene?.generation_job_id?.startsWith('kaggle:') && ['Rendering','Processing'].includes(scene.status)) {
            const service = new KaggleApiService({ database:db, run:diagnose });
            try {
              const result = await service.sync(scene.user_id, scene);
              outcome = result.status === 'Ready' ? 'import-completed' : 'provider-still-pending';
            } catch (error) {
              outcome = /1080p MP4/.test(error.message) ? 'output-missing-or-ambiguous' : /no longer matches/.test(error.message) ? 'import-race' : /^[A-Z_0-9]{2,32}$/.test(error.code || '') ? error.code : /^[\w. -]{1,200}$/.test(error.message) && /(?:Error|Exception)/.test(error.message) ? error.message : 'import-failed';
            }
            scene = await current();
          }
          if (scene?.status === 'Ready' && /^uploads\/scenes\/kaggle-5-[\w-]+\.mp4$/.test(scene.video_path || '')) {
            const file = await stat('public/' + scene.video_path);
            if (file.isFile() && file.size > 0) outcome = 'scene-ready-with-new-kaggle-mp4';
          }
          console.log(outcome);
          process.exit(0);
          NODE
          REMOTE
          )"
          printf 'summary=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: "${{ steps.result.outputs.summary }}"
        run: echo 'Only the import result is reported.'

