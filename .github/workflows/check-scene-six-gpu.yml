name: Check Scene 6 GPU quota and status
on:
  push:
    branches: [main]
    paths: [.github/workflows/check-scene-six-gpu.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Read Kaggle GPU quota and Scene 6 state
        id: result
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes studiosorrydotco@studio.sorrydotcom.lk 'bash -s' <<'REMOTE'
          set -euo pipefail
          export LD_LIBRARY_PATH="$HOME/.local${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cd ~/apps/sorrydotcomeditor/current
          "$HOME/.local/node/bin/node" --input-type=module <<'NODE'
          import { publicEncrypt } from 'node:crypto';
          import { spawnSync } from 'node:child_process';
          import { stat } from 'node:fs/promises';
          import { connect, loadEnvironment } from 'noderyx-framework';
          import { KaggleApiService } from './app/Services/KaggleApiService.js';
          loadEnvironment();
          const { default: config } = await import('./noderyx.config.js');
          const db = await connect(config.database);
          const service = new KaggleApiService({ database:db });
          const [scene] = await db.query('SELECT s.status,s.generation_job_id,s.video_path,p.user_id FROM scenes s JOIN projects p ON p.id=s.project_id WHERE s.id=?',[6]);
          let state = 'scene-unknown';
          let quota = null;
          const credentials = scene ? await service.credentials(scene.user_id).catch(() => null) : null;
          if (scene?.status === 'Ready' && /^uploads\/scenes\/kaggle-6-[\w-]+\.mp4$/.test(scene.video_path || '')) {
            const file = await stat('public/' + scene.video_path).catch(() => null);
            if (file?.size > 0) state = 'ready-mp4-verified';
          }
          if (scene?.generation_job_id?.startsWith('kaggle:')) {
            const kernel = scene.generation_job_id.slice(7);
            if (kernel.split('/')[0] !== credentials?.username) state = 'saved-connection-mismatch';
            else {
              try {
                const { status } = await service.run({ action:'status', credentials, kernel }, 25000);
                state = /^[a-z0-9_]{1,32}$/i.test(status || '') ? status : 'unknown';
              } catch { state = 'provider-status-unavailable'; }
            }
          }
          if (credentials) {
            const code = [
              'import contextlib, io, json, os, sys, tempfile',
              'from datetime import timezone',
              'creds = json.load(sys.stdin)',
              'try:',
              '    with tempfile.TemporaryDirectory() as home, contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):',
              '        for key in ("KAGGLE_USERNAME", "KAGGLE_KEY", "KAGGLE_API_TOKEN"):',
              '            os.environ.pop(key, None)',
              '        os.environ.update(HOME=home, USERPROFILE=home, KAGGLE_CONFIG_DIR=home, KAGGLE_USERNAME=creds["username"])',
              '        os.environ["KAGGLE_KEY" if creds["kind"] == "legacy" else "KAGGLE_API_TOKEN"] = creds["secret"]',
              '        from kaggle.api.kaggle_api_extended import KaggleApi',
              '        api = KaggleApi(); api.authenticate()',
              '        response = api.quota_view()',
              '        report = response.gpu_quota',
              '        reset = response.quota_refresh_time',
              '        if reset is not None and reset.utcoffset() is None: reset = reset.replace(tzinfo=timezone.utc)',
              '        result = None if report is None else {"total":int(report.total_time_allowed.total_seconds()),"used":int(report.time_used.total_seconds()),"reset":reset.isoformat() if reset else None}',
              '    print(json.dumps(result))',
              'except BaseException:',
              '    print("null")',
            ].join('\n');
            const python = process.env.KAGGLE_PYTHON || '../../shared/kaggle-venv/bin/python';
            const checked = spawnSync(python, ['-c',code], { input:JSON.stringify(credentials), encoding:'utf8', timeout:35000 });
            try { quota = JSON.parse(checked.stdout || 'null'); } catch { quota = null; }
          }
          const key = Buffer.from('','base64');
          const result = JSON.stringify({ state, quota });
          console.log(publicEncrypt({ key, format:'der', type:'spki', oaepHash:'sha256' }, Buffer.from(result)).toString('base64'));
          process.exit(0);
          NODE
          REMOTE
          )"
          printf 'part1=%s\npart2=%s\n' "${result:0:172}" "${result:172}" >> "$GITHUB_OUTPUT"
      - name: "Quota part 1 ${{ steps.result.outputs.part1 }}"
        run: echo 'Encrypted quota only.'
      - name: "Quota part 2 ${{ steps.result.outputs.part2 }}"
        run: echo 'Encrypted quota only.'

