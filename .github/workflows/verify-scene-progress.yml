name: Verify Scene 5 progress on the live studio
on:
  push:
    branches: [main]
    paths: [.github/workflows/verify-scene-progress.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Read the active Scene 5 render status
        id: result
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          result="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes studiosorrydotco@studio.sorrydotcom.lk 'bash -s' <<'REMOTE'
          set -euo pipefail
          export LD_LIBRARY_PATH="$HOME/.local${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          base="$HOME/apps/sorrydotcomeditor"
          for attempt in {1..30}; do
            if grep -Fq 'watchProgress(userId, scene)' "$base/current/app/Services/KaggleApiService.js"; then break; fi
            sleep 5
          done
          cd "$base/current"
          grep -Fq 'watchProgress(userId, scene)' app/Services/KaggleApiService.js
          "$HOME/.local/node/bin/node" --input-type=module <<'NODE'
          import { open } from 'node:fs/promises';
          import { connect, loadEnvironment } from 'noderyx-framework';
          import { KaggleApiService } from './app/Services/KaggleApiService.js';
          loadEnvironment();
          const { default: config } = await import('./noderyx.config.js');
          const db = await connect(config.database);
          const service = new KaggleApiService({ database:db });
          const [scene] = await db.query('SELECT s.status,s.generation_job_id,s.video_path,p.user_id FROM scenes s JOIN projects p ON p.id=s.project_id WHERE s.id=?',[5]);
          let outcome = 'scene-unavailable';
          if (scene?.status === 'Ready' && /^uploads\/scenes\/kaggle-5-[\w-]+\.mp4$/.test(scene.video_path || '')) {
            const file = await open('public/' + scene.video_path,'r');
            try {
              const buffer = Buffer.alloc(512 * 1024);
              const { bytesRead } = await file.read(buffer);
              const at = buffer.subarray(0,bytesRead).indexOf('mvhd');
              const scale = at >= 0 && at + 36 <= bytesRead && buffer[at+4] === 0 ? buffer.readUInt32BE(at+16) : 0;
              const duration = scale ? buffer.readUInt32BE(at+20) / scale : 0;
              outcome = duration > 8 ? 'scene-ready-with-new-two-shot-mp4' : 'scene-ready-duration-unconfirmed';
            } finally { await file.close(); }
          } else if (scene?.generation_job_id?.startsWith('kaggle:')) {
            const safe = value => /^[a-z0-9_]{1,32}$/i.test(value || '') ? value : 'unknown';
            try {
              const status = await service.sync(scene.user_id, scene, { download:false });
              outcome = 'kaggle-' + safe(status.status);
              if (status.status === 'running') {
                for (let i=0;i<12;i++) {
                  const detail = service.watchProgress(scene.user_id, scene);
                  if (detail) { outcome += '-progress-' + safe(detail.stage); break; }
                  await new Promise(resolve => setTimeout(resolve,3000));
                }
              }
            } catch { outcome = 'provider-check-unavailable'; }
          }
          console.log(outcome);
          process.exit(0);
          NODE
          REMOTE
          )"
          printf 'summary=%s\n' "$result" >> "$GITHUB_OUTPUT"
      - name: "${{ steps.result.outputs.summary }}"
        run: echo 'Only the run status and progress category are reported.'

