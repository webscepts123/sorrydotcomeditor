name: Diagnose live scene page
on:
  push:
    branches: [main]
    paths: [.github/workflows/diagnose-scene-page.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Read sanitized error signature
        id: signature
        env:
          CPANEL_KEY: ${{ secrets.CPANEL_KEY }}
          CPANEL_KNOWN_HOSTS: ${{ secrets.CPANEL_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$CPANEL_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$CPANEL_KNOWN_HOSTS" > ~/.ssh/known_hosts
          summary="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes studiosorrydotco@studio.sorrydotcom.lk 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd ~/apps/sorrydotcomeditor/shared/logs
          python3 - <<'PY'
          from pathlib import Path
          import re
          logs = sorted(Path('.').glob('*.log'), key=lambda file: file.stat().st_mtime, reverse=True)
          for file in logs[:12]:
              matches = list(re.finditer(r'^\[Noderyx 500\] GET /scenes/5(?:[ ?]|$).*', file.read_text(errors='replace'), re.M))
              if not matches:
                  continue
              match = matches[-1]
              trace = file.read_text(errors='replace')[match.start():match.end() + 1800]
              kind = re.search(r'\b(\w*Error):', trace)
              code = re.search(r"code: ['\"]([A-Z_0-9]+)['\"]", trace)
              line = re.search(r'(ProductionController\.js|scenes\.noderframe):(\d+)', trace)
              reference = re.search(r'ReferenceError: ([A-Za-z_$][\w$]*) is not defined', trace)
              trace = re.split(r'\n\[Noderyx ', trace, maxsplit=1)[0]
              stack = re.findall(r'[/\\]([A-Za-z0-9_.-]+\.(?:m?js|noderframe)):(\d+):\d+', trace)
              stack = [f"{name}:{number}" for name, number in stack[:5]]
              markers = [label for label, pattern in {
                  "json-parse": r'JSON\.parse|not valid JSON',
                  "regex": r'Invalid regular expression',
                  "unexpected-token": r'Unexpected token',
                  "unexpected-identifier": r'Unexpected identifier',
                  "unclosed-input": r'Unexpected end',
                  "invalid-token": r'Invalid or unexpected token',
                  "module-load": r'compileSourceTextModule|ModuleLoader',
                  "mysql": r'mysql2|MariaDB|SQL syntax',
                  "compiler": r'compileFile|renderView|noderframe',
              }.items() if re.search(pattern, trace, re.I)]
              print(" ".join(value for value in [kind and kind[1], code and code[1], line and line[0], reference and reference[1], *markers, *stack] if value) or "Unclassified scene error")
              break
          else:
              print("No matching scene 500 in recent releases")
          PY
          REMOTE
          )"
          printf 'summary=%s\n' "$summary" >> "$GITHUB_OUTPUT"
      - name: "Scene error — ${{ steps.signature.outputs.summary }}"
        run: echo 'Only the sanitized error signature is reported.'

